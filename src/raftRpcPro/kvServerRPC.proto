syntax = "proto3";

package raftKVRpcProctoc;

option cc_generic_services = true;

message GetArgs {
  bytes Key = 1;
  bytes ClientId = 2;
  int32 RequestId = 3;
}

message GetReply {
  bytes Err = 1;
  bytes Value = 2;
}

message PutAppendArgs {
  bytes Key = 1;
  bytes Value = 2;
  bytes Op = 3;
  bytes ClientId = 4;
  int32 RequestId = 5;
}

message PutAppendReply {
  bytes Err = 1;
}

message FetchShardDataArgs {
  int32 ShardId = 1;
  int32 ConfigVersion = 2;
}

message FetchShardDataReply {
  bytes Err = 1;
  int32 ConfigVersion = 2;
  bytes ShardData = 3;
  bytes LastRequestId = 4;
}

service kvServerRpc {
  rpc PutAppend(PutAppendArgs) returns (PutAppendReply);
  rpc Get(GetArgs) returns (GetReply);
  rpc FetchShardData(FetchShardDataArgs) returns (FetchShardDataReply);
}
